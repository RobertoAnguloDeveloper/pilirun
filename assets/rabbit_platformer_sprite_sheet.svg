<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536"
     height="768"
     viewBox="0 0 1536 768"
     role="img"
     aria-labelledby="title description"
     shape-rendering="geometricPrecision">
  <title id="title">White Rabbit Platformer Sprite Sheet</title>
  <desc id="description">Eighteen vector SVG sprites for idle, running, jumping, falling and landing animations.</desc>

  <!--
    Vector sprite sheet. Every cell is 256 x 256.
    Row 1: idle 01-04, jump takeoff 01-02
    Row 2: run 01-06
    Row 3: jump 03-04, fall 01-02, land/recover 01-02
    The background is intentionally transparent.
  -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F7F9FF"/>
      <stop offset="1" stop-color="#DDE5F2"/>
    </linearGradient>
    <linearGradient id="furWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF8"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CA7FF"/>
      <stop offset="1" stop-color="#1262D4"/>
    </linearGradient>
    <linearGradient id="earPink" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFB2BD"/>
      <stop offset="1" stop-color="#F37D94"/>
    </linearGradient>

    <style>
      .fur { fill: url(#fur); stroke: #182A49; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .fur-warm { fill: url(#furWarm); stroke: #182A49; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .ear-inner { fill: url(#earPink); stroke: #182A49; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .scarf { fill: url(#scarf); stroke: #123E86; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke: #182A49; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .eye { fill: #4A2B32; stroke: #182A49; stroke-width: 2; }
      .eye-shine { fill: #FFFFFF; stroke: none; }
      .nose { fill: #F47F92; stroke: #182A49; stroke-width: 2; }
      .cheek { fill: #FFB7C2; opacity: .65; stroke: none; }
    </style>

    <!-- Idle anatomy -->
    <g id="idle-ears">
